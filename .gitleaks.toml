# Конфигурация gitleaks для этого репозитория.
#
#     gitleaks git . --redact --no-banner --exit-code 0
#     gitleaks dir . --redact --no-banner --exit-code 0
#
# Обе команды должны давать `no leaks found`. Если появилось новое исключение —
# оно добавляется сюда с объяснением, а не замалчивается ключом `--no-verify`
# или тем, что «мы посмотрели, там всё нормально». Молчаливое исключение
# невозможно перепроверить, а следующий человек потратит время заново.

[extend]
useDefault = true

[[allowlists]]
description = """
Ключи пресетов моделей Whisper в таблице PRESETS (engine.py). Правило
generic-api-key реагирует на поле с именем `key` и значением высокой энтропии;
здесь это идентификатор модели вида `large-v3-turbo`, который уходит в
Hugging Face как часть имени репозитория. Не секрет и секретом быть не может:
значение видно в интерфейсе, в настройках и в имени скачанной папки.
"""
targetRules = ["generic-api-key"]
# Два пути — один файл: в старых коммитах пакет назывался `iwhisper`
# (переименование в T-318). История хранит прежний путь навсегда, поэтому
# исключение по одному только новому пути оставляет находку в `gitleaks git`.
paths = ['''^src/(saytype|iwhisper)/engine\.py$''']
# Сверяем со значением (`secret`) — это то, что правило посчитало ключом.
# Полное имя пресета целиком, с якорями: список закрытый, случайный секрет под
# него не подойдёт.
regexes = ['''^(tiny|base|small|medium|large-v3|large-v3-turbo)$''']
# Оба условия должны выполниться разом: и файл тот, и значение из списка.
# Без этого allowlist по одному только пути закрыл бы весь engine.py.
regexTarget = "secret"
condition = "AND"
